name: Installers

# Builds the installers the way a user without admin rights would: conda
# for Node, mdBook and a C compiler; rustup per user, with the GNU
# toolchain on Windows. Artifacts are attached to the run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-gnu:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment-windows.yml
          activate-environment: decker
          auto-activate-base: false
      - name: Rust GNU toolchain (rustup, per user)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
          gcc --version | head -1
      - uses: Swatinem/rust-cache@v2
        with:
          key: gnu
      - run: npm ci
        working-directory: apps/deck-app
      - name: Build the NSIS installer (per-user)
        run: npx tauri build --bundles nsis
        working-directory: apps/deck-app
      - uses: actions/upload-artifact@v4
        with:
          name: decker-windows-setup
          path: apps/deck-app/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/deck-app
      - run: npx tauri build --bundles deb,appimage
        working-directory: apps/deck-app
      - uses: actions/upload-artifact@v4
        with:
          name: decker-linux
          path: |
            apps/deck-app/src-tauri/target/release/bundle/deb/*.deb
            apps/deck-app/src-tauri/target/release/bundle/appimage/*.AppImage

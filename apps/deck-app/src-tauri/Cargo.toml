[package]
name = "deck-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "decker: editor, presentation window and presenter mode"

[lib]
name = "deck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[features]
default = ["typst"]
# Formulas rendered by the embedded Typst engine (adds ~30 MiB to the binary).
typst = ["dep:deck-typst"]

[dependencies]
deck-core = { path = "../../../crates/deck-core" }
deck-convert = { path = "../../../crates/deck-convert" }
deck-typst = { path = "../../../crates/deck-typst", optional = true }
tauri.workspace = true
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true

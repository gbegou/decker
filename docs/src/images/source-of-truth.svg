<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="380" viewBox="0 0 1140 380" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
    <circle cx="5" cy="5" r="4" fill="#444"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="40" y="20" width="160" height="50" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="120.0" y="45.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Presenter window</text>
<line x1="120" y1="70" x2="120" y2="330" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="340" y="20" width="160" height="50" rx="8" fill="#fde8d7" stroke="#c9742f" stroke-width="1.5"/>
<text x="420.0" y="36.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Rust state</text>
<text x="420.0" y="53.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">Mutex&lt;AppState&gt;</text>
<line x1="420" y1="70" x2="420" y2="330" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="640" y="20" width="160" height="50" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="720.0" y="45.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Audience window</text>
<line x1="720" y1="70" x2="720" y2="330" stroke="#bbb" stroke-dasharray="4 4"/>
<rect x="940" y="20" width="160" height="50" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="1020.0" y="45.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Editor window</text>
<line x1="1020" y1="70" x2="1020" y2="330" stroke="#bbb" stroke-dasharray="4 4"/>
<line x1="120" y1="100" x2="420" y2="100" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="94.0" text-anchor="middle" font-size="11" fill="#444" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" paint-order="stroke" stroke="white" stroke-width="4">navigate(&quot;next&quot;)</text>
<rect x="414" y="120" width="12" height="40" fill="#fde8d7" stroke="#c9742f"/>
<text x="434" y="143" font-size="11" fill="#333">step += 1, or next slide</text>
<line x1="420" y1="180" x2="120" y2="180" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="270.0" y="174.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">View</text>
<line x1="420" y1="200" x2="720" y2="200" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="570.0" y="194.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">event &quot;view-changed&quot;</text>
<line x1="420" y1="220" x2="1020" y2="220" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="720.0" y="214.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">event &quot;view-changed&quot;</text>
<line x1="720" y1="260" x2="420" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="570.0" y="254.0" text-anchor="middle" font-size="11" fill="#444" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" paint-order="stroke" stroke="white" stroke-width="4">get_view()</text>
<line x1="420" y1="280" x2="720" y2="280" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="570.0" y="274.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">View at the new step</text>
<line x1="1020" y1="300" x2="420" y2="300" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="720.0" y="294.0" text-anchor="middle" font-size="11" fill="#444" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" paint-order="stroke" stroke="white" stroke-width="4">get_view()</text>
<line x1="420" y1="320" x2="1020" y2="320" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="720.0" y="314.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">View</text>
<text x="570" y="360" text-anchor="middle" font-size="12" fill="#555">Windows never talk to each other and keep no state beyond what they draw. A Python macro will call the same state functions as the commands.</text>
</svg>

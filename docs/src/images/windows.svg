<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
    <circle cx="5" cy="5" r="4" fill="#444"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="20" y="20" width="520" height="250" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/><text x="32" y="38" font-size="12" font-weight="600" fill="#999" letter-spacing="0.5">LAPTOP SCREEN, PRIMARY MONITOR</text>
<rect x="580" y="20" width="380" height="250" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="8 5"/><text x="592" y="38" font-size="12" font-weight="600" fill="#999" letter-spacing="0.5">PROJECTOR, SECOND MONITOR</text>
<rect x="50" y="60" width="200" height="180" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="150.0" y="141.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Editor</text>
<text x="150.0" y="158.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">stays open</text>
<rect x="280" y="60" width="230" height="180" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="395.0" y="116.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Presenter</text>
<text x="395.0" y="133.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">current slide</text>
<text x="395.0" y="150.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">next step or slide</text>
<text x="395.0" y="167.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">notes · timer</text>
<text x="395.0" y="184.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">thumbnails</text>
<rect x="610" y="60" width="320" height="180" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="770.0" y="124.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Audience</text>
<text x="770.0" y="141.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">fullscreen, no decorations</text>
<text x="770.0" y="158.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">black on B</text>
<text x="770.0" y="175.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">click or keys: next</text>
<line x1="510" y1="150" x2="610" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#dot)" stroke-dasharray="5 4"/>
<text x="560.0" y="144.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">same Rust state</text>
<text x="490" y="300" text-anchor="middle" font-size="12" fill="#555">With a single monitor only the audience window opens, fullscreen. Keys everywhere: arrows, Page Up/Down, Space, Enter, Home, End, B, Escape.</text>
</svg>

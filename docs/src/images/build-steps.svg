<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
    <circle cx="5" cy="5" r="4" fill="#444"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="20" y="40" width="170" height="70" rx="8" fill="#fde8d7" stroke="#c9742f" stroke-width="1.5"/>
<text x="105.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">base</text>
<text x="105.0" y="75.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">rect 50,40 500×60</text>
<text x="105.0" y="92.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">opacity 1</text>
<rect x="250" y="40" width="170" height="70" rx="8" fill="#fff8d6" stroke="#c2a200" stroke-width="1.5"/>
<text x="335.0" y="66.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">step 0</text>
<text x="335.0" y="83.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">opacity: 0</text>
<rect x="480" y="40" width="170" height="70" rx="8" fill="#fff8d6" stroke="#c2a200" stroke-width="1.5"/>
<text x="565.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">step 1</text>
<text x="565.0" y="75.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">opacity: 1</text>
<text x="565.0" y="92.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">duration 0.3 s</text>
<rect x="710" y="40" width="170" height="70" rx="8" fill="#fff8d6" stroke="#c2a200" stroke-width="1.5"/>
<text x="795.0" y="58.0" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">step 2</text>
<text x="795.0" y="75.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">x: 600</text>
<text x="795.0" y="92.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">fill: #0088FF</text>
<line x1="190" y1="75.0" x2="250" y2="75.0" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="220.0" y="69.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">apply</text>
<line x1="420" y1="75.0" x2="480" y2="75.0" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450.0" y="69.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">apply</text>
<line x1="650" y1="75.0" x2="710" y2="75.0" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="680.0" y="69.0" text-anchor="middle" font-size="11" fill="#444" paint-order="stroke" stroke="white" stroke-width="4">apply</text>
<text x="335.0" y="160" text-anchor="middle" font-size="12" fill="#333">state_at(0): hidden</text>
<text x="565.0" y="160" text-anchor="middle" font-size="12" fill="#333">state_at(1): visible, fades in</text>
<text x="795.0" y="160" text-anchor="middle" font-size="12" fill="#333">state_at(2): moved to x=600, blue</text>
<text x="450" y="200" text-anchor="middle" font-size="12" fill="#555">Appear, disappear, move, grow, spin and recolor are one mechanism: overrides applied in order up to the step.</text>
</svg>

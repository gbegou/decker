<svg xmlns="http://www.w3.org/2000/svg" width="660" height="590" viewBox="0 0 660 590" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
  </marker>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
    <circle cx="5" cy="5" r="4" fill="#444"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="40" y="20" width="260" height="60" rx="8" fill="#eeeeee" stroke="#777777" stroke-width="1.5"/>
<text x="170.0" y="41.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">deck.json</text>
<text x="170.0" y="58.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">on disk</text>
<rect x="40" y="120" width="260" height="60" rx="8" fill="#fde8d7" stroke="#c9742f" stroke-width="1.5"/>
<text x="170.0" y="141.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Deck</text>
<text x="170.0" y="158.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">Rust struct</text>
<rect x="40" y="220" width="260" height="60" rx="8" fill="#fde8d7" stroke="#c9742f" stroke-width="1.5"/>
<text x="170.0" y="241.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">SVG string</text>
<text x="170.0" y="258.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">one &lt;g id=&quot;eN&quot;&gt; per element</text>
<rect x="40" y="320" width="260" height="60" rx="8" fill="#fde8d7" stroke="#c9742f" stroke-width="1.5"/>
<text x="170.0" y="341.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">View</text>
<text x="170.0" y="358.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">svg, next_svg, notes, elements…</text>
<rect x="40" y="420" width="260" height="60" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="170.0" y="441.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Webview DOM</text>
<text x="170.0" y="458.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">Svelte component</text>
<rect x="40" y="520" width="260" height="60" rx="8" fill="#dceeff" stroke="#2f72c9" stroke-width="1.5"/>
<text x="170.0" y="541.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-size="14">Pixels</text>
<text x="170.0" y="558.5" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#333">fonts, GPU</text>
<line x1="170.0" y1="80" x2="170.0" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="104.0" font-size="12" fill="#444" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">serde</text>
<line x1="170.0" y1="180" x2="170.0" y2="220" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="204.0" font-size="12" fill="#444" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">render_step(slide, step)</text>
<line x1="170.0" y1="280" x2="170.0" y2="320" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="304.0" font-size="12" fill="#444">inline assets as data URIs</text>
<line x1="170.0" y1="380" x2="170.0" y2="420" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="404.0" font-size="12" fill="#444">command result or event</text>
<line x1="170.0" y1="480" x2="170.0" y2="520" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="504.0" font-size="12" fill="#444">browser engine</text>
<text x="360" y="250" font-size="12" fill="#555">render_step is a pure function of the model</text>
<text x="360" y="267" font-size="12" fill="#555">and the step: the same SVG serves the editor,</text>
<text x="360" y="284" font-size="12" fill="#555">the audience and presenter windows, the</text>
<text x="360" y="301" font-size="12" fill="#555">thumbnails, and later the PDF export.</text>
</svg>

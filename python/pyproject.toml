[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decker-slides"
version = "0.1.0"
description = "Build and script decker decks: the document model of the decker slide editor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
keywords = ["slides", "presentation", "decker", "typst"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Presentation",
]

[project.urls]
Repository = "https://github.com/gbegou/decker"

[project.scripts]
decker-py = "decker.__main__:main"

[tool.setuptools]
packages = ["decker"]
